# Publishes to npm. Two jobs do it:
# - `publish`, when a GitHub release is published: a pre-release version
#   (0.6.0-next.1) goes to the `next` dist-tag, any other to `latest`;
# - `next`, when CI passes on a push to main: a build of that commit, versioned
#   by scripts/next-version.mjs (0.8.1-next.2.gb28f2da), goes to `next`. No tag,
#   no GitHub release, and nothing is committed.
# A third, `registry`, follows `publish` for a stable version only and lists
# it in the official MCP registry from server.json.
# npm trusted publishing authenticates both (OIDC, no token), and npm adds
# provenance. The trusted publisher on npmjs.com names this file and the
# `publish` environment, which is why both jobs live here.
#
# npm only takes a trusted publisher for a package that exists, so the
# package's first version was published by hand.

name: Publish

on:
  release:
    types: [published]
  # Matches ci.yml's `name`; renaming that workflow stops next releases.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: npm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # One release at a time. GitHub cancels a pending job when another joins its
    # group, so next builds have a group of their own and never cancel a pending
    # release.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    # The trusted publisher on npmjs.com names this environment.
    environment: publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 ships npm 11.19; trusted publishing needs 11.5.1 or later. No
      # dependency cache: a release job shouldn't restore what other runs saved.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      # The tag must name the version being published, and the release must be
      # marked as a pre-release exactly when the version is one: the README links
      # to the latest release, which GitHub picks among non-pre-releases.
      - name: Check the release against package.json
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG doesn't match package.json version $version."
            exit 1
          fi
          case "${version%%+*}" in
            *-*) dist_tag=next is_prerelease=true ;;
            *) dist_tag=latest is_prerelease=false ;;
          esac
          if [ "$PRERELEASE" != "$is_prerelease" ]; then
            echo "::error::The release's pre-release setting ($PRERELEASE) doesn't match version $version."
            exit 1
          fi
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - run: npm run check:registry
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # prepublishOnly builds dist/.
      - run: npm publish --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}

  registry:
    name: MCP registry
    needs: publish
    # Stable versions only: the registry makes the highest semver version its
    # latest, so a pre-release (0.9.0-next.0 sorts above 0.8.1) would be offered
    # ahead of the last stable release. A job of its own, so no npm dependency
    # runs with its OIDC token, and a failed run is re-run without npm publish.
    if: needs.publish.outputs.dist-tag == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the registry's GitHub OIDC login
    env:
      # Upgrade deliberately, never to releases/latest: the step below checks
      # that this tag's release workflow in modelcontextprotocol/registry built
      # the binary.
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        working-directory: ${{ runner.temp }}
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --remote-name "$base_url/$archive"
          curl --fail --location --silent --show-error --remote-name "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar xzf "$archive" mcp-publisher

      # The registry reads the package's mcpName from registry.npmjs.org, which
      # can take a moment to serve a version that npm publish has just added.
      - name: Wait for npm to serve the version
        run: |
          name=$(jq -r .name server.json)
          url="https://registry.npmjs.org/$(jq -r '.packages[0].identifier' server.json)/$(jq -r '.packages[0].version' server.json)"
          for _ in $(seq 20); do
            if [ "$(curl --fail --silent "$url" | jq -r .mcpName)" = "$name" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::$url didn't serve mcpName $name within 5 minutes."
          exit 1

      - name: Publish server.json
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
          echo "Published \`$(jq -r .name server.json)\` $(jq -r .version server.json) to the MCP registry." >> "$GITHUB_STEP_SUMMARY"

  next:
    name: npm (next)
    # Only CI runs for pushes to main in this repository, not in a fork, and only
    # while the commit is still main's tip (github.sha, for a workflow_run): a
    # pull request's run, from a branch or a fork, never publishes, and neither
    # does a run for an older commit that finishes late or is re-run.
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'emilkrebs/med-research-mcp' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    # One next build at a time, and a newer tip's build replaces a pending one.
    # The group is the job's, not the workflow's: every CI run that completes on
    # a branch named main starts this workflow, and a skipped job is never
    # queued, so it can't cancel the tip's pending build.
    concurrency:
      group: publish-next
      cancel-in-progress: false
    environment: publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      # The commit CI passed on, with all history and tags: the version counts
      # commits since the last release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      # Leaves the version empty when main has moved on or nothing that ships
      # has changed since the current `next` build; the steps below then skip.
      - name: Pick the version
        id: version
        run: node scripts/next-version.mjs

      # CI has already typechecked and tested this commit on every supported Node.
      - if: steps.version.outputs.version != ''
        run: npm ci

      # The version is set in this checkout only. mcpb/manifest.json ships in
      # the package too, so it gets the version as well. prepublishOnly builds
      # dist/, which inlines the version.
      - name: Publish
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          node -e '
            const fs = require("node:fs");
            const file = "mcpb/manifest.json";
            const text = fs.readFileSync(file, "utf-8");
            const updated = text.replace(/^(  "version": )"[^"]*"/m, `$1"${process.env.VERSION}"`);
            if (updated === text) throw new Error(`No top-level version in ${file}.`);
            fs.writeFileSync(file, updated);
          '
          npm publish --tag next
          echo "Published \`med-research-mcp@$VERSION\` to the \`next\` dist-tag." >> "$GITHUB_STEP_SUMMARY"
